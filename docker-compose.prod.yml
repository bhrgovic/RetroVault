name: retrovault-prod

services:
  db:
    image: postgres:15
    container_name: retrovault-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retro}
      POSTGRES_DB: ${POSTGRES_DB:-retrovault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retro} -d ${POSTGRES_DB:-retrovault}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/${IMAGE_OWNER:-bhrgovic}/retrovault-backend:${IMAGE_TAG:-latest}
    container_name: retrovault-prod-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-retro}:${POSTGRES_PASSWORD:-retro}@db:5432/${POSTGRES_DB:-retrovault}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    ports:
      - "8000:8000"

  frontend:
    image: ghcr.io/${IMAGE_OWNER:-bhrgovic}/retrovault-frontend:${IMAGE_TAG:-latest}
    container_name: retrovault-prod-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

  prometheus:
    image: prom/prometheus
    container_name: retrovault-prod-prometheus
    restart: always
    depends_on:
      - backend
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: retrovault-prod-grafana
    restart: always
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  postgres_data:
  uploads_data:
  prometheus_data:
  grafana_data:
